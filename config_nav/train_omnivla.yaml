# =============================================================================
# OmniVLA Training Config
#
# This is the only YAML consumed by the canonical OmniVLA trainer:
#
#   bash scripts/omnivla_training.sh train
#
# It is also the YAML uploaded by the Vertex submitter. Vertex may override some
# values from CLI flags, but it still launches the same trainer.
#
# Important distinction:
# - This is NOT an ACT / LeRobot policy config.
# - Fields such as policy.type, chunk_size, vision_backbone, job.output_dir,
#   optimizer.type, or top-level wandb are ignored by this trainer.
# - OmniVLA action chunk size and action dimensionality are fixed in code by
#   prismatic/vla/constants.py: NUM_ACTIONS_CHUNK=8 and ACTION_DIM=4.
#
# Default intent of this file:
# - Fine-tune OmniVLA, not OpenVLA pure.
# - Use robotcom/single_waypoints as a tiny public smoke-test dataset.
# - Use all episodes by default; no old training manifests are shipped.
# - Save LoRA adapter + action_head + pose_projector checkpoints.
# - For a real run, copy this file or edit the dataset block to point at your
#   new LeRobot dataset.
# =============================================================================


# -----------------------------------------------------------------------------
# DATASET
# -----------------------------------------------------------------------------
# The trainer expects a LeRobot-format dataset.
#
# Required data shape / semantics:
# - observation.image.main: primary RGB camera image.
# - action: at least [linear_velocity, angular_velocity].
# - episode_index and frame_index metadata.
# - language_instruction is optional; default_language_instruction is used if
#   the dataset does not provide one.
# - observation.state.waypoints is optional; when present, it is used to build
#   goal_pose and enables pose-conditioned modality_id_with_pose.
#
# Dataset source:
# - To load from Hugging Face, set root: null and repo_id: owner/dataset.
# - To load from disk, set root: /absolute/path/to/dataset and repo_id: null.
#
# Episode curation:
# - episodes_file can be null, a JSON list, a JSON {"clean_episodes": [...]},
#   or the recommended compact YAML manifest generated by:
#
#     python omnivla_training/training_scripts/curate_episodes.py \
#       --repo-id my_org/my_dataset \
#       --check-video-duration \
#       --overflow-threshold-s 0.5 \
#       --output config_nav/episode_manifests/my_dataset.yaml
# -----------------------------------------------------------------------------
dataset:
  # Human-readable label used in run/checkpoint names. It does not change data.
  name: single_waypoints

  # Local dataset root. Use an absolute path when training from disk.
  # Example:
  #   root: /mnt/datasets/my_lerobot_dataset
  # If root is non-null, repo_id is ignored by the trainer.
  root: null

  # Hugging Face dataset repo. Used only when root is null.
  # Examples:
  #   repo_id: robotcom/single_waypoints
  #   repo_id: my_org/my_dataset
  repo_id: robotcom/single_waypoints

  # Hugging Face revision: branch, tag, or commit hash.
  revision: main

  # true = do not hit the network; require the dataset to already exist in the
  # local Hugging Face cache. Useful for offline runs.
  local_files_only: false

  # Video decoder passed to LeRobot.
  # Recommended: pyav
  # Alternative: torchcodec, if your environment is set up for it.
  video_backend: pyav

  # Timestamp tolerance in seconds for video frame lookup. Smaller values catch
  # metadata/video mismatch earlier; larger values may hide minor timestamp
  # jitter. Keep 0.001 unless you know your dataset needs more tolerance.
  tolerance_s: 0.001

  # Runtime resilience against decode/timestamp failures. If a sample fails with
  # a known skippable decode error, the dataset retries another sample up to this
  # many times. This is not a replacement for curation; curate bad episodes when
  # possible.
  max_decode_retries: 8

  # Optional clean-episode manifest. Keep null for a new clean dataset or a
  # smoke-test dataset. Set a path only after you generate one for your dataset
  # with omnivla_training/training_scripts/curate_episodes.py.
  episodes_file: null

  # Optional holdout split from the loaded clean episode list.
  # Current trainer does NOT run validation on this holdout; it only removes
  # those episodes from optimization. Keep 0.0 unless you intentionally want a
  # fixed offline-eval split.
  val_ratio: 0.0

  # Seed used only when val_ratio > 0.
  split_seed: 7

  # PyTorch DataLoader workers. Lower this if RAM or video decoding is unstable.
  # Typical local values: 0, 2, 4. Vertex/A100 boxes can use 8+ if stable.
  num_workers: 4

  # Number of previous frames packed into auxiliary cur_image tensors.
  # This is not ACT's n_obs_steps. OmniVLA still receives current image + goal
  # image as the VLA visual input. Use 0 for tiny smoke datasets; 5 can be used
  # for larger navigation datasets that benefit from short temporal context.
  context_size: 0

  # Spacing between future raw actions before converting them into 8 waypoints.
  # 1 means consecutive frames. 2 means every other frame, and also doubles the
  # integration dt used by the action conversion.
  action_spacing: 1

  # Dataset key used as raw velocity action source. The value must be a 2D
  # vector [linear_velocity, angular_velocity].
  #
  # Common cases:
  # - robotcom/single_waypoints: observation.state
  # - many velocity-control navigation datasets: action
  #
  # Why this exists: some LeRobot datasets store GPS/lat-lon waypoint targets in
  # `action` and store robot twist in `observation.state`. Feeding lat/lon into
  # the velocity integrator would train nonsense.
  action_key: observation.state

  # Resolution for auxiliary cur_image / goal_image_8 tensors. This does not
  # change the VLA image processor resolution. Kept small for memory.
  aux_image_size: [96, 96]

  # Meters per normalized waypoint unit. With 0.1, value 1.0 means 10 cm.
  metric_waypoint_spacing: 0.1

  # Prompt fallback when the dataset lacks language_instruction.
  default_language_instruction: reach the goal image

  # OmniVLA modality ids used by the MMN model.
  # 6 = language + goal image, no goal pose.
  # 8 = language + goal image + goal pose.
  # Do not change these unless you also change the model's modality convention.
  modality_id_without_pose: 6
  modality_id_with_pose: 8


# -----------------------------------------------------------------------------
# MODEL / CHECKPOINT BASE
# -----------------------------------------------------------------------------
# This decides which checkpoint we fine-tune from.
#
# Recommended for navigation:
#   vla_path: NHirose/omnivla-original
#
# OpenVLA ablation:
#   vla_path: openvla/openvla-7b
#
# Local model path:
#   vla_path: /absolute/path/to/omnivla-original
#
# The trainer always saves LoRA adapters. model.use_lora must stay true.
# -----------------------------------------------------------------------------
model:
  # Default: OmniVLA navigation checkpoint, not OpenVLA pure.
  vla_path: NHirose/omnivla-original

  # OmniVLA route uses two images: current image + goal image.
  # Keep 2 unless you are changing model/data code together.
  num_images_in_input: 2

  # Attention implementation.
  # Recommended: sdpa. It avoids requiring FlashAttention in local setups.
  # Alternative: flash_attention_2 if installed and compatible.
  attn_implementation: sdpa

  # Canonical trainer requires LoRA because checkpoints are saved as adapters.
  use_lora: true

  # LoRA capacity. 32 is the default used for current runs.
  # Lower (8/16): cheaper, less capacity. Higher (64): more capacity/memory.
  lora_rank: 32

  # LoRA dropout. 0.0 is standard for this setup.
  lora_dropout: 0.0


# -----------------------------------------------------------------------------
# TRAINING
# -----------------------------------------------------------------------------
# Effective batch size:
#
#   batch_size * number_of_gpus * grad_accumulation_steps
#
# With defaults on 1 GPU: 1 * 1 * 8 = 8.
#
# Note about memory:
# The ACT config for robotcom/single_waypoints can fit on ~8 GB because ACT is
# small. OmniVLA is a 7B-class VLA. Even with a tiny dataset, use a large GPU.
# -----------------------------------------------------------------------------
training:
  # Per-GPU microbatch. Keep 1 for 7B unless you have lots of VRAM.
  batch_size: 1

  # Number of backward passes before optimizer.step().
  grad_accumulation_steps: 8

  # Base fallback LR. vla_learning_rate/head_learning_rate override this for
  # their parameter groups, but keep learning_rate as a readable run summary.
  learning_rate: 0.00002

  # LR for LoRA parameters on the VLA backbone.
  # Lower when starting from NHirose/omnivla-original; higher only for ablations.
  vla_learning_rate: 0.00002

  # LR for pose_projector + action_head, which start from scratch.
  head_learning_rate: 0.0001

  # LR schedule. Valid values:
  # - cosine: warmup then cosine decay to min_lr_ratio.
  # - linear: warmup then linear decay to min_lr_ratio.
  # - constant: warmup then constant LR.
  scheduler: cosine

  # Warmup optimizer steps. 0 disables warmup.
  warmup_steps: 500

  # Minimum LR ratio for cosine/linear schedules.
  # 0.1 means decay down to 10% of initial LR.
  min_lr_ratio: 0.1

  # AdamW weight decay.
  weight_decay: 0.01

  # Gradient clipping norm. Set 0 to disable clipping.
  max_grad_norm: 1.0

  # Optimizer steps, not dataset epochs and not frames.
  # Default is intentionally small because this file doubles as a smoke-test
  # example. Increase this for real datasets.
  # For smoke tests, CLI --smoke-test overrides this to 1.
  max_steps: 1000

  # Optional final-waypoint pose/object supervision.
  # Keep 0.0 unless goal_pose/object pose quality is validated.
  object_loss_weight: 0.0

  # Smoothness regularizer between consecutive predicted waypoints.
  # 0.0 disables it. 0.02 is a conservative navigation default.
  smoothness_loss_weight: 0.02


# -----------------------------------------------------------------------------
# CHECKPOINTS
# -----------------------------------------------------------------------------
# Each checkpoint contains:
# - lora_adapter/
# - action_head--{step}_checkpoint.pt
# - pose_projector--{step}_checkpoint.pt
# - resolved_config.yaml
# - tokenizer / processor files
# -----------------------------------------------------------------------------
checkpoint:
  # Local output root. Vertex rewrites this to /tmp/omnivla_output inside the
  # container and syncs to GCS through the wrapper.
  run_root_dir: runs/omnivla_train

  # Save every N optimizer steps.
  save_freq: 500

  # false = keep checkpoint per save_freq.
  # true = overwrite a single latest checkpoint directory.
  save_latest_only: false

  # false is recommended. true saves a merged full model during training, which
  # is slow and large. Inference can merge LoRA at load time.
  merge_lora_during_training: false


# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  # Print/W&B frequency in optimizer steps.
  log_freq: 10

  # Smoothing window for printed metrics.
  metrics_window_steps: 50

  wandb:
    # Set true only when WANDB_API_KEY is configured.
    # Vertex wrapper disables W&B automatically if WANDB_API_KEY is unavailable.
    enable: false
    entity: null
    project: omnivla-training


# =============================================================================
# COMMON EDITS / PRESETS
#
# These are comments only. Copy values into the sections above when needed.
# =============================================================================

# -----------------------------------------------------------------------------
# Preset: keep the default public smoke dataset
# -----------------------------------------------------------------------------
# dataset:
#   name: single_waypoints
#   root: null
#   repo_id: robotcom/single_waypoints
#   revision: main
#   local_files_only: false
#   video_backend: pyav
#   tolerance_s: 0.001
#   max_decode_retries: 8
#   episodes_file: null
#   val_ratio: 0.0
#   split_seed: 7
#   num_workers: 4
#   context_size: 0
#   action_spacing: 1
#   action_key: observation.state
#   aux_image_size: [96, 96]
#   metric_waypoint_spacing: 0.1
#   default_language_instruction: reach the goal image
#   modality_id_without_pose: 6
#   modality_id_with_pose: 8
#
# training:
#   batch_size: 1
#   grad_accumulation_steps: 8
#   learning_rate: 0.00002
#   vla_learning_rate: 0.00002
#   head_learning_rate: 0.0001
#   scheduler: cosine
#   warmup_steps: 100
#   min_lr_ratio: 0.1
#   weight_decay: 0.01
#   max_grad_norm: 1.0
#   max_steps: 1000
#   object_loss_weight: 0.0
#   smoothness_loss_weight: 0.02

# -----------------------------------------------------------------------------
# Preset: use a local dataset snapshot
# -----------------------------------------------------------------------------
# dataset:
#   name: my_local_dataset
#   root: /absolute/path/to/lerobot/dataset
#   repo_id: null
#   episodes_file: null
#
# With a generated clean-episode manifest:
#   episodes_file: config_nav/episode_manifests/my_local_dataset.yaml

# -----------------------------------------------------------------------------
# Preset: create a clean episode manifest
# -----------------------------------------------------------------------------
# python omnivla_training/training_scripts/curate_episodes.py \
#   --repo-id my_org/my_dataset \
#   --check-video-duration \
#   --overflow-threshold-s 0.5 \
#   --output config_nav/episode_manifests/my_dataset.yaml
#
# Manual exclusions:
# python omnivla_training/training_scripts/curate_episodes.py \
#   --root /absolute/path/to/lerobot/dataset \
#   --exclude-episode-range 720 829 \
#   --exclude-video chunk-000:33 \
#   --output config_nav/episode_manifests/my_dataset.yaml

# -----------------------------------------------------------------------------
# Preset: OpenVLA ablation instead of OmniVLA
# -----------------------------------------------------------------------------
# model:
#   vla_path: openvla/openvla-7b
#   num_images_in_input: 2
#   attn_implementation: sdpa
#   use_lora: true
#   lora_rank: 32
#   lora_dropout: 0.0

# -----------------------------------------------------------------------------
# Vertex CLI overrides
# -----------------------------------------------------------------------------
# The YAML stays the same, but you can override some values at submit time:
#
# python omnivla_training/vertex/submit_training_job.py \
#   --config-path config_nav/train_omnivla.yaml \
#   --dataset-repo-id robotcom/single_waypoints \
#   --model-path NHirose/omnivla-original \
#   --steps 1000 \
#   --batch-size 1 \
#   --grad-accumulation-steps 8 \
#   --save-freq 250
